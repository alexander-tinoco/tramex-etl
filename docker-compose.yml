# Development stack.
#
# Brings up the full ecosystem with hot reload. Production uses
# docker-compose.prod.yml, which consumes the images published to GHCR and
# does not mount the code as a volume.
#
#   docker compose up -d

name: tramex

services:
  db:
    image: postgres:16-alpine
    container_name: tramex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: tramex
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tramex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tramex_redis
    restart: unless-stopped
    # The brute-force counters can be rebuilt; there's no need to persist
    # them, and disabling the dump avoids unnecessary writes.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot job. Migrations do NOT live in the API's startup: with several
  # replicas, they'd all try to migrate the same database at once. Here they
  # run once and also seed the initial administrator.
  migraciones:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: tramex_migraciones
    command: sh -c "alembic upgrade head && python -m scripts.sembrar_admin"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres_password@db:5432/tramex
      TRAMEX_FERNET_KEY: ${TRAMEX_FERNET_KEY:?define TRAMEX_FERNET_KEY in a root .env file}
      API_SECRET_KEY: ${API_SECRET_KEY:-clave-de-desarrollo-no-usar-en-produccion}
      APP_ENV: development
      ADMIN_INICIAL_CORREO: ${ADMIN_INICIAL_CORREO:-admin@example.com}
      ADMIN_INICIAL_CONTRASENA: ${ADMIN_INICIAL_CONTRASENA:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: tramex_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres_password@db:5432/tramex
      REDIS_URL: redis://redis:6379
      TRAMEX_FERNET_KEY: ${TRAMEX_FERNET_KEY:?define TRAMEX_FERNET_KEY in a root .env file}
      API_SECRET_KEY: ${API_SECRET_KEY:-clave-de-desarrollo-no-usar-en-produccion}
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8080
      COOKIE_SECURE: "false"
      LOG_LEVEL: INFO
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      # Code only; the Python environment lives in the image.
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./shared:/app/shared
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: tramex_frontend
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src
      # Static assets (logo, favicon) are mounted too: without this, adding
      # an image would require rebuilding the Docker image to see it, and the
      # browser would return a 404 without explaining why.
      - ./frontend/public:/app/public
      # Anonymous volume so the image's node_modules isn't shadowed by the
      # host's, which may contain binaries for a different platform.
      - /app/node_modules
    environment:
      # Inside the container `localhost` is the dashboard itself; the API
      # answers at the Docker network's service name.
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "4200:4200"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: tramex_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana-oss:11.5.1
    container_name: tramex_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # The dashboard is read-only for guests; there's no client data in the
      # metrics, but there's still no reason to open up sign-up.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: tramex_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5051:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:
