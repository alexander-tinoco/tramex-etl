title = "Tramex gitleaks config"

[extend]
useDefault = true

# The two values below are fixed test data on purpose, repeated across several
# files so the same command works in CI, in the tests, and in the README's
# quick-start guide. Neither encrypts nor protects real data. The rest of
# gitleaks' default rules stay active: a real key or password, different from
# these, would still trigger the scan.
[allowlist]
description = "Fixed test values with no real data: sample Fernet key and the backend test suite password."
regexes = [
  # Sample Fernet key: CI, backend and ETL tests, README.
  '''CxNCUQhBIDIRsETw8i-dfZBdmcnh6YX43VWS-9txMY4=''',
  # Fixed password for the users seeded in the backend's test suite.
  '''contrasena-de-prueba-1234''',
]
