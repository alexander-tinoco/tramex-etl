# Shared configuration for the monorepo's Python tooling.
# Ruff, mypy and pytest discover it from the root, so the backend, the ETL
# and the shared package are governed by the same rules.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "venv", "node_modules", "frontend", "*/alembic/versions/d419612ba5db_*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # comprehensions
    "RUF",  # ruff's own rules
]
ignore = [
    # `id` as a parameter name is the natural vocabulary of a CRUD repository
    # and matches the column name.
    "A002",
    # Long strings in Spanish error messages frequently exceed the limit, and
    # splitting them makes them unreadable.
    "E501",
    # PEP 695 generics syntax (`class CRUDBase[M, C, U]`). Not adopted because
    # the repository layer's TypeVars are shared across modules
    # (`app.crud.tramites` imports them from `app.crud.base` to type its
    # subclass), and PEP 695 type parameters have class scope and can't be
    # reused that way.
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated and read as scripts, not as a library.
"backend/alembic/**" = ["E402", "F401"]
# Tests declare large sample data on purpose.
"**/tests/**" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# `Depends`, `Query` and friends are called in default values by design:
# that's how FastAPI declares dependency injection.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tramex_shared", "helpers"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
# Strict mode isn't enabled: it would require annotating every last detail of
# SQLAlchemy and FastAPI, which already infer a lot on their own, and the
# noise would end up burying the warnings that actually matter. What is
# required is that annotated functions line up and that no stale ignores are
# left behind.
[tool.mypy]
python_version = "3.12"
files = ["backend/app", "etl", "shared/tramex_shared"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = "(\\.venv|node_modules|alembic/versions)"

[[tool.mypy.overrides]]
# Migrations are generated scripts, reviewed by hand; annotating them adds nothing.
module = "alembic.*"
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    # `shared`'s and the ETL's doctests document and verify the normalization
    # rules at the same time; running them keeps the example and the code
    # from drifting apart over time.
    "--doctest-modules",
]
testpaths = ["backend/tests", "etl/tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::UserWarning:starlette.*",
]

[tool.coverage.run]
branch = true
source = ["backend/app", "etl/helpers", "shared/tramex_shared"]
omit = ["*/alembic/*", "*/tests/*", "*/conftest.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The threshold exists so coverage doesn't drop silently. The previous
# version generated the report but never failed because of it.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
