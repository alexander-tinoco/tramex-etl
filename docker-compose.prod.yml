# Stack de produccion.
#
# Consume las imagenes publicadas en GHCR por el pipeline de CD en lugar de
# compilar, no monta el codigo como volumen y no publica al exterior ningun
# puerto de infraestructura: solo el del proxy.
#
#   docker compose -f docker-compose.prod.yml up -d

name: tramex-prod

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tramex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # La base no publica puerto: solo se alcanza desde la red interna.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migraciones:
    image: ghcr.io/alexander-tinoco/tramex-etl-backend:${TAG:-latest}
    entrypoint: ["sh", "-c"]
    command: ["alembic upgrade head && python -m scripts.sembrar_admin"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL}
      TRAMEX_FERNET_KEY: ${TRAMEX_FERNET_KEY:?falta TRAMEX_FERNET_KEY}
      API_SECRET_KEY: ${API_SECRET_KEY:?falta API_SECRET_KEY}
      APP_ENV: production
      COOKIE_SECURE: "true"
      REDIS_URL: redis://redis:6379
      ADMIN_INICIAL_CORREO: ${ADMIN_INICIAL_CORREO:?falta ADMIN_INICIAL_CORREO}
      ADMIN_INICIAL_CONTRASENA: ${ADMIN_INICIAL_CONTRASENA:?falta ADMIN_INICIAL_CONTRASENA}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: ghcr.io/alexander-tinoco/tramex-etl-backend:${TAG:-latest}
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL}
      REDIS_URL: redis://redis:6379
      TRAMEX_FERNET_KEY: ${TRAMEX_FERNET_KEY:?falta TRAMEX_FERNET_KEY}
      API_SECRET_KEY: ${API_SECRET_KEY:?falta API_SECRET_KEY}
      APP_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?falta ALLOWED_ORIGINS}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: strict
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: INFO
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    deploy:
      # La API no tiene estado en memoria (los contadores viven en Redis), asi
      # que escala horizontalmente sin coordinacion.
      replicas: 2

  frontend:
    image: ghcr.io/alexander-tinoco/tramex-etl-frontend:${TAG:-latest}
    restart: always
    # Unico puerto publicado. Delante deberia ir un terminador TLS.
    ports:
      - "${PUERTO_PUBLICO:-8080}:8080"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"

  grafana:
    image: grafana/grafana-oss:11.5.1
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?falta GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?falta GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${PUERTO_GRAFANA:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
