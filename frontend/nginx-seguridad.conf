# Cabeceras de seguridad para las respuestas que sirve Nginx directamente.
#
# Este archivo existe porque `add_header` NO se hereda: en cuanto un bloque
# `location` declara una cabecera propia, las del nivel superior desaparecen
# para ese bloque. Declararlas una vez aqui e incluirlas en cada location es
# la unica forma de que ninguna respuesta se quede sin ellas por descuido.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
