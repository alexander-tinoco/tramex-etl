  <!--
    Barlow Semi Condensed  · signage voice: labels, lanes, headings.
    Atkinson Hyperlegible  · human voice: names and prose.
    Atkinson Hyperlegible Mono · data voice: passports, case numbers, credentials.
      Designed by the Braille Institute to distinguish l/I/1 and 0/O. This is not
      an aesthetic choice here: these values get transcribed by hand into consular
      portals, and mistaking one character is a lost trip.
  -->

THESIS: The record reads as a border-control lane panel: one datum per strip,
legible from a meter away. Rejects the metric-card dashboard and icon rail
common to this category.
OWN-WORLD: Light concrete (#F2F4F3), petroleum-green enameled panels (#003C48)
from the logo, sage (#84C0A8) on the active lane, structural steel (#185868).
Gold (#C8B060) is reserved exclusively for revealing credentials. Custom solid
pictograms; Barlow Semi Condensed labels, Atkinson Hyperlegible reads, and its
mono variant carries the transcribable data.
STORY: The operator sees a person's full record and confirms that touching a
credential leaves a trace: the system hands back the audit-entry number.
FIRST VIEWPORT: Panel rail on the left, symbol on top. On the right, a
label-scale search bar spanning the width; below it, a dense-row board of
recent activity with its color lane, and a counts row styled like a window
marker, never cards.
FORM: Border-control-room signage, candidate 5 of 7; seed bc773ca1.
