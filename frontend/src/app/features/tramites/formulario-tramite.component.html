<div class="telon" (click)="cerrar.emit()">
  <div class="ventanilla" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
    <header class="ventanilla-cabecera">
      <h3>
        <app-picto [nombre]="esEdicion() ? 'editar' : 'anadir'" [tamano]="18" />
        {{ esEdicion() ? 'Edit' : 'New' }} · {{ recurso().titulo }}
      </h3>
      <button type="button" class="boton-icono" (click)="cerrar.emit()" aria-label="Close">
        <app-picto nombre="cerrar" [tamano]="16" />
      </button>
    </header>

    <form (submit)="enviar($event)" novalidate>
      <div class="ventanilla-cuerpo">
        <div class="rejilla-campos">
          @for (campo of recurso().campos; track campo.nombre) {
            <label class="campo" [class.campo-ancho]="campo.anchoCompleto">
              <span class="nombre-campo">
                {{ campo.etiqueta }}
                @if (campo.requerido) {
                  <em class="obligatorio" aria-hidden="true">*</em>
                }
              </span>
              <input
                [type]="campo.tipo"
                [name]="campo.nombre"
                [required]="!!campo.requerido"
                [attr.autocomplete]="campo.tipo === 'password' ? 'new-password' : 'off'"
                [ngModel]="valores()[campo.nombre]"
                (ngModelChange)="actualizarCampo(campo.nombre, $event)"
                [disabled]="guardando()"
              />
              @if (campo.ayuda) {
                <small class="ayuda">{{ campo.ayuda }}</small>
              }
              @if (campo.tipo === 'password' && esEdicion()) {
                <small class="ayuda">Leave it blank to keep the current credential.</small>
              }
            </label>
          }
        </div>

        @if (error()) {
          <div class="aviso error" role="alert">
            <app-picto nombre="aviso" [tamano]="18" />
            <span>{{ error() }}</span>
          </div>
        }
      </div>

      <footer class="ventanilla-pie">
        <button type="button" class="boton secundario" (click)="cerrar.emit()" [disabled]="guardando()">
          Cancel
        </button>
        <button type="submit" class="boton" [disabled]="guardando()">
          {{ guardando() ? 'Saving…' : 'Save' }}
        </button>
      </footer>
    </form>
  </div>
</div>
