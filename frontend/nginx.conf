# Configuracion del proxy inverso del dashboard.
#
# El frontend y la API se sirven bajo el mismo origen a proposito: asi el
# navegador no necesita CORS y, sobre todo, la cookie de sesion `httpOnly`
# viaja sin depender de politicas entre dominios.

server {
    listen 80;
    server_name _;

    # Ocultar la version de Nginx: no ayuda a nadie salvo a quien busca
    # exploits conocidos de una version concreta.
    server_tokens off;

    # Limite del cuerpo de las peticiones. La API solo recibe JSON de formulario;
    # sin limite, una peticion enorme puede agotar memoria.
    client_max_body_size 1m;

    # Las cabeceras de seguridad viven en un fragmento incluido en cada
    # `location`: `add_header` no se hereda, asi que declararlas solo aqui las
    # perderia en todo bloque que anada una cabecera propia.
    include /etc/nginx/snippets/seguridad.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los bundles de Angular llevan hash en el nombre, asi que pueden cachearse
    # de forma agresiva; el index.html nunca, o el navegador seguiria pidiendo
    # bundles de una version anterior tras un despliegue.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/seguridad.conf;
        # Solo `add_header`, sin `expires`: la directiva `expires` emite su
        # propio Cache-Control y la respuesta acabaria con dos.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/seguridad.conf;
        # El index nunca se cachea: si se cacheara, tras un despliegue el
        # navegador seguiria pidiendo los bundles de la version anterior.
        add_header Cache-Control "no-store" always;
    }

    # Enrutado del lado del cliente: cualquier ruta desconocida devuelve la SPA.
    location / {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/seguridad.conf;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Resolutor DNS interno de Docker. Es necesario porque el destino del
    # proxy se pasa en una variable: cuando `proxy_pass` recibe un literal,
    # Nginx resuelve el nombre al arrancar y se niega a levantar si el backend
    # todavia no existe, lo que deja el dashboard en bucle de reinicio cada vez
    # que la API tarda un poco mas en estar lista. Con una variable la
    # resolucion ocurre en cada peticion: si la API esta caida se devuelve 502,
    # que es un fallo acotado, en lugar de no arrancar.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $destino_api http://backend:8000;
        # Con destino variable, Nginx no reescribe la URI automaticamente, asi
        # que se reenvia la original completa (incluida la cadena de consulta).
        proxy_pass $destino_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La API usa X-Forwarded-For para registrar la IP real en la bitacora
        # de auditoria; sin esto veria siempre la IP del contenedor de Nginx.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        set $destino_salud http://backend:8000;
        proxy_pass $destino_salud/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Las metricas no se exponen al exterior: las raspa Prometheus dentro de la
    # red de Docker, y publicarlas revelaria la forma del trafico interno.
    location = /metrics {
        deny all;
        return 404;
    }
}
