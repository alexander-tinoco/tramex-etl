# Dashboard reverse proxy configuration.
#
# The frontend and the API are served under the same origin on purpose: that
# way the browser doesn't need CORS and, above all, the `httpOnly` session
# cookie travels without depending on cross-domain policies.

server {
    listen 80;
    server_name _;

    # Hide the Nginx version: it doesn't help anyone except someone looking
    # for known exploits for a specific version.
    server_tokens off;

    # Request body size limit. The API only receives form JSON; without a
    # limit, a huge request can exhaust memory.
    client_max_body_size 1m;

    # Security headers live in a snippet included in every `location`:
    # `add_header` isn't inherited, so declaring them only here would lose
    # them in any block that adds a header of its own.
    include /etc/nginx/snippets/seguridad.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Angular bundles carry a hash in the name, so they can be cached
    # aggressively; index.html never, or the browser would keep requesting
    # bundles from a previous version after a deploy.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/seguridad.conf;
        # Only `add_header`, no `expires`: the `expires` directive emits its
        # own Cache-Control and the response would end up with two.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/seguridad.conf;
        # The index is never cached: if it were, after a deploy the browser
        # would keep requesting the previous version's bundles.
        add_header Cache-Control "no-store" always;
    }

    # Client-side routing: any unknown route returns the SPA.
    location / {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/seguridad.conf;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Docker's internal DNS resolver. It's needed because the proxy target is
    # passed in a variable: when `proxy_pass` receives a literal, Nginx
    # resolves the name at startup and refuses to come up if the backend
    # doesn't exist yet, which leaves the dashboard in a restart loop
    # whenever the API takes a bit longer to be ready. With a variable,
    # resolution happens on every request: if the API is down, a 502 is
    # returned, which is a bounded failure, instead of failing to start.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $destino_api http://backend:8000;
        # With a variable target, Nginx doesn't rewrite the URI automatically,
        # so the full original one is forwarded (including the query string).
        proxy_pass $destino_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API uses X-Forwarded-For to log the real IP in the audit trail;
        # without this it would always see the Nginx container's IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        set $destino_salud http://backend:8000;
        proxy_pass $destino_salud/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Metrics aren't exposed externally: Prometheus scrapes them inside the
    # Docker network, and publishing them would reveal the shape of internal
    # traffic.
    location = /metrics {
        deny all;
        return 404;
    }
}
