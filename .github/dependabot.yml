version: 2
updates:
  # API dependencies (Python / pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-dependencies:
        patterns: ["*"]

  # ETL pipeline dependencies (Python / pip)
  - package-ecosystem: "pip"
    directory: "/etl"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels: ["dependencies", "etl"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      etl-dependencies:
        patterns: ["*"]

  # Dashboard dependencies (Node / npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      angular:
        patterns: ["@angular*", "zone.js", "rxjs"]
      frontend-dependencies:
        patterns: ["*"]
        exclude-patterns: ["@angular*", "zone.js", "rxjs"]

  # Governance tooling at the root (Node / npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "tooling"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used by the pipelines
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"

  # Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "docker"]
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "docker"]
