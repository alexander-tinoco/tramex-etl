version: 2
updates:
  # Dependencias de la API (Python / pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels: ["dependencias", "backend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-dependencies:
        patterns: ["*"]

  # Dependencias del pipeline ETL (Python / pip)
  - package-ecosystem: "pip"
    directory: "/etl"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels: ["dependencias", "etl"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      etl-dependencies:
        patterns: ["*"]

  # Dependencias del dashboard (Node / npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels: ["dependencias", "frontend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      angular:
        patterns: ["@angular*", "zone.js", "rxjs"]
      frontend-dependencies:
        patterns: ["*"]
        exclude-patterns: ["@angular*", "zone.js", "rxjs"]

  # Herramientas de gobernanza en la raiz (Node / npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencias", "tooling"]
    commit-message:
      prefix: "chore(deps)"

  # Acciones de GitHub usadas por los pipelines
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels: ["dependencias", "ci"]
    commit-message:
      prefix: "ci(deps)"

  # Imagenes base de los Dockerfile
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    labels: ["dependencias", "docker"]
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    labels: ["dependencias", "docker"]
