name: CD

# La entrega se dispara solo con una etiqueta de version o una publicacion de
# release, no con cada push a main: publicar una imagen `latest` en cada commit
# hace imposible saber que se esta ejecutando en produccion.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  # Necesario para firmar las imagenes con la identidad del flujo de trabajo.
  id-token: write

env:
  REGISTRO: ghcr.io
  IMAGEN_BACKEND: ${{ github.repository }}-backend
  IMAGEN_FRONTEND: ${{ github.repository }}-frontend

jobs:
  publicar:
    name: Compilar y publicar imagenes en GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticarse en el registro
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- API -------------------------------------------------------------
      - name: Etiquetas y metadatos de la API
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRO }}/${{ env.IMAGEN_BACKEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Tramex API
            org.opencontainers.image.description=API de gestion de tramites migratorios
            org.opencontainers.image.licenses=MIT

      - name: Publicar la API
        id: push-backend
        uses: docker/build-push-action@v6
        with:
          # El contexto es la raiz: la imagen necesita el paquete `shared/`,
          # que la API y el ETL comparten.
          context: .
          file: backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Dashboard -------------------------------------------------------
      - name: Etiquetas y metadatos del dashboard
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRO }}/${{ env.IMAGEN_FRONTEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Tramex Dashboard
            org.opencontainers.image.description=Panel de gestion de tramites
            org.opencontainers.image.licenses=MIT

      - name: Publicar el dashboard
        id: push-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen de la publicacion
        run: |
          {
            echo "## Imágenes publicadas"
            echo ""
            echo "| Imagen | Digest |"
            echo "|---|---|"
            echo "| \`${{ env.IMAGEN_BACKEND }}\` | \`${{ steps.push-backend.outputs.digest }}\` |"
            echo "| \`${{ env.IMAGEN_FRONTEND }}\` | \`${{ steps.push-frontend.outputs.digest }}\` |"
            echo ""
            echo "Despliegue:"
            echo '```bash'
            echo "TAG=${GITHUB_REF_NAME} docker compose -f docker-compose.prod.yml up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  vulnerabilidades:
    name: Escaneo de vulnerabilidades
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write

    strategy:
      # Que falle el escaneo de una imagen no debe ocultar el resultado de la
      # otra: interesan las dos.
      fail-fast: false
      matrix:
        imagen: [backend, frontend]

    steps:
      - name: Escanear la imagen publicada
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRO }}/${{ github.repository }}-${{ matrix.imagen }}:${{ github.ref_name }}
          format: sarif
          output: trivy-${{ matrix.imagen }}.sarif
          severity: CRITICAL,HIGH
          # No se rompe la entrega por una vulnerabilidad de la imagen base sin
          # parche disponible; el hallazgo queda registrado en la pestana de
          # seguridad para atenderlo.
          exit-code: "0"

      - name: Publicar el resultado en el panel de seguridad
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.imagen }}.sarif
          category: trivy-${{ matrix.imagen }}
