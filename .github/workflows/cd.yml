name: CD

# Delivery only triggers on a version tag or a release publication, not on
# every push to main: publishing a `latest` image on every commit makes it
# impossible to know what's actually running in production.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  # Required to sign the images with the workflow's identity.
  id-token: write

env:
  REGISTRO: ghcr.io
  IMAGEN_BACKEND: ${{ github.repository }}-backend
  IMAGEN_FRONTEND: ${{ github.repository }}-frontend

jobs:
  publicar:
    name: Build and publish images to GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- API -------------------------------------------------------------
      - name: API tags and metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRO }}/${{ env.IMAGEN_BACKEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Tramex API
            org.opencontainers.image.description=Immigration tramite management API
            org.opencontainers.image.licenses=MIT

      - name: Publish the API
        id: push-backend
        uses: docker/build-push-action@v6
        with:
          # The context is the root: the image needs the `shared/` package,
          # which the API and the ETL both consume.
          context: .
          file: backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Dashboard -------------------------------------------------------
      - name: Dashboard tags and metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRO }}/${{ env.IMAGEN_FRONTEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Tramex Dashboard
            org.opencontainers.image.description=Tramite management panel
            org.opencontainers.image.licenses=MIT

      - name: Publish the dashboard
        id: push-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publication summary
        run: |
          {
            echo "## Published images"
            echo ""
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`${{ env.IMAGEN_BACKEND }}\` | \`${{ steps.push-backend.outputs.digest }}\` |"
            echo "| \`${{ env.IMAGEN_FRONTEND }}\` | \`${{ steps.push-frontend.outputs.digest }}\` |"
            echo ""
            echo "Deploy:"
            echo '```bash'
            echo "TAG=${GITHUB_REF_NAME} docker compose -f docker-compose.prod.yml up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  vulnerabilidades:
    name: Vulnerability scan
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write

    strategy:
      # A failed scan on one image shouldn't hide the result of the other:
      # both matter.
      fail-fast: false
      matrix:
        imagen: [backend, frontend]

    steps:
      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRO }}/${{ github.repository }}-${{ matrix.imagen }}:${{ github.ref_name }}
          format: sarif
          output: trivy-${{ matrix.imagen }}.sarif
          severity: CRITICAL,HIGH
          # A vulnerability in the base image without an available patch
          # doesn't block delivery; the finding stays logged in the security
          # tab to be addressed.
          exit-code: "0"

      - name: Publish the result to the security dashboard
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.imagen }}.sarif
          category: trivy-${{ matrix.imagen }}
