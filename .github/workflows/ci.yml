name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest
        env:
          # Proveemos una llave Fernet y BD de desarrollo seguras para que
          # la carga de configuraciones inicial no falle en CI.
          TRAMEX_FERNET_KEY: "CxNCUQhBIDIRsETw8i-dfZBdmcnh6YX43VWS-9txMY4="
          DATABASE_URL: "sqlite:///:memory:"
          API_SECRET_KEY: "ci-secret-key-test-only"
          API_USERNAME: "admin"
          API_PASSWORD: "changeme"
        run: |
          cd backend
          python -m pytest --cov=app tests/ -v

  etl-syntax-check:
    name: ETL Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt

      - name: Validate ETL Script Compilation
        run: |
          python -m py_compile etl/etl_tramex.py

  frontend-build:
    name: Frontend Build (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Linter (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Run Unit Tests (Jasmine/Karma)
        run: |
          cd frontend
          npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build Angular Application
        run: |
          cd frontend
          npm run build

  docker-publish:
    name: Build & Push Docker Images to GHCR
    needs: [backend-tests, etl-syntax-check, frontend-build]
    # Solo se ejecuta al hacer push en la rama principal, no en Pull Requests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata (tags, labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
