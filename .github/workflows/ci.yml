name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push on the same branch cancels the previous run: reviewing a commit
# that's already stale just burns runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valid Fernet key generated exclusively for CI. It doesn't encrypt any
  # real data; it exists because configuration is fail-fast and without it
  # the application won't even start to run the tests.
  TRAMEX_FERNET_KEY: "CxNCUQhBIDIRsETw8i-dfZBdmcnh6YX43VWS-9txMY4="
  API_SECRET_KEY: "clave-de-ci-sin-valor-en-produccion"
  APP_ENV: development
  BCRYPT_RONDAS: "4"

jobs:
  # ---------------------------------------------------------------------------
  secretos:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans the full history, not just the latest commit: a
          # leaked secret is still leaked even after it's removed from the file.
          fetch-depth: 0

      # gitleaks-action automatically detects and uses the repository root's
      # `.gitleaks.toml` (no GITLEAKS_CONFIG variable or --config needed, it's
      # the binary's own default lookup). That file allows two fixed test
      # values reused on purpose in several places in the repository (a sample
      # Fernet key and a password from the backend's test suite); neither
      # encrypts or protects real data, and the rest of gitleaks' default
      # rules stay active against any other secret.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  calidad-python:
    name: Style and types (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r etl/requirements.txt
          pip install -e ./shared

      - name: Ruff (style)
        run: ruff check backend etl shared

      - name: Ruff (format)
        run: ruff format --check backend etl shared

      - name: mypy (types)
        run: mypy

  # ---------------------------------------------------------------------------
  pruebas-python:
    name: Tests and coverage (API + ETL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r etl/requirements.txt
          pip install -e ./shared

      - name: Run the suite with a coverage threshold
        # The threshold lives in pyproject (fail_under = 85): the run fails
        # if coverage drops, instead of just reporting it.
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Publish the coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-python
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  integracion:
    name: Migrations and ETL against PostgreSQL
    runs-on: ubuntu-latest

    # The unit tests run on SQLite. This job exists for what SQLite can't
    # verify: that migrations apply and revert against real PostgreSQL, that
    # the trigram index gets created, and that the ETL is genuinely idempotent
    # against the database it's deployed against.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: tramex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres_password@localhost:5432/tramex

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r etl/requirements.txt
          pip install -e ./shared

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Verify that migrations are reversible
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Check for drift between models and migrations
        working-directory: backend
        # If `autogenerate` detects changes, someone modified a model without
        # writing the corresponding migration.
        run: |
          alembic revision --autogenerate -m "deteccion-de-deriva" --rev-id deriva
          if grep -qE "op\.(create|drop|add|alter)_" alembic/versions/deriva_*.py; then
            echo "::error::Models and migrations don't match. Generate the missing migration."
            cat alembic/versions/deriva_*.py
            exit 1
          fi
          rm alembic/versions/deriva_*.py

      - name: Seed the initial administrator
        working-directory: backend
        env:
          ADMIN_INICIAL_CONTRASENA: contrasena-de-integracion-1234
        run: python -m scripts.sembrar_admin

      - name: Generate a test file and verify ETL idempotency
        run: python .github/scripts/verificar_etl.py

  # ---------------------------------------------------------------------------
  frontend:
    name: Style, types, tests and build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  imagenes:
    name: Build Docker images
    runs-on: ubuntu-latest
    # Building on every PR catches a broken Dockerfile before attempting to
    # publish. Nothing gets pushed: that's the delivery pipeline's job.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
