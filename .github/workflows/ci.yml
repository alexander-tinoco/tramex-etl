name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest
        env:
          # Proveemos una llave Fernet y BD de desarrollo seguras para que
          # la carga de configuraciones inicial no falle en CI.
          TRAMEX_FERNET_KEY: CxNCUQhBIDIRsETw8i-dfZBdmcnh6YX43VWS-9txMY4=
          DATABASE_URL: sqlite:///:memory:
        run: |
          cd backend
          python -m pytest --cov=app tests/ -v

  etl-syntax-check:
    name: ETL Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt

      - name: Validate ETL Script Compilation
        run: |
          python -m py_compile etl/etl_tramex.py
